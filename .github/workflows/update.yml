name: Actualizar calendario

on:
  schedule:
    - cron: "17 5,17 * * *"   # dos veces al día (07:17 y 19:17 en Madrid, horario de verano)
  workflow_dispatch: {}       # botón "Run workflow" para forzarlo a mano
  push:
    branches: [main]
    paths: [scrape.py, .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: calendario
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer la web y regenerar el .ics
        run: python scrape.py
      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "azoteros-bot"
          git config user.email "azoteros-bot@users.noreply.github.com"
          git add azoteros.ics state.json
          git commit -m "Actualizar calendario"
          git push
